<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Recordar</title>
    <meta name="description" content="Antes de salir, revisa que no te olvidas nada." />

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0F9D58" />

    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Recordar" />

    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #f4f6f9;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          // Relativo a la página: funciona igual en la raíz o en un subdirectorio
          // (p. ej. GitHub Pages sirve la app en /Recordar/).
          navigator.serviceWorker.register('sw.js').catch(function (err) {
            console.log('SW no registrado:', err);
          });
        });
      }
    </script>
  </body>
</html>
